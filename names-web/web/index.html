<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>SimpleX Names</title>
</head>
<body>
  <h1>SimpleX Names</h1>
  <p>Your redemption code: <code id="code"></code></p>
  <p><label>Name <input id="label"></label></p>
  <p><label>Contact link <input id="contact" pattern="[^;]*" title="One link, without ;"></label></p>
  <p><label>Channel link <input id="channel" pattern="[^;]*" title="One link, without ;"></label></p>
  <p><button id="register">Register</button></p>
  <h2>Commit request</h2>
  <pre id="commit-request"></pre>
  <h2>Register request</h2>
  <pre id="register-request"></pre>
  <script type="module" src="./main.ts"></script>
</body>
</html>
