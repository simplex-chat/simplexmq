name: build

on:
  push:
    branches:
      - master
      - stable
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:

# =============================
#       Create release
# =============================

# Create release, but only if it's triggered by tag push.
# On pull requests/commits push, this job will always complete.

  maybe-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build changelog
        id: build_changelog
        if: startsWith(github.ref, 'refs/tags/v')
        uses: simplex-chat/release-changelog-builder-action@v5
        with:
          configuration: .github/changelog_conf.json
          failOnError: true
          ignorePreReleases: true
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: simplex-chat/action-gh-release@v2
        with:
          body: |
            See full changelog [here](https://github.com/simplex-chat/simplexmq/blob/master/CHANGELOG.md).

            Commits:
            ${{ steps.build_changelog.outputs.changelog }}
          prerelease: true
          files: |
            LICENSE
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =============================
#        Main build job
# =============================

  build:
    name: "ubuntu-${{ matrix.os }}-${{ matrix.arch }}, GHC: ${{ matrix.ghc }}"
    needs: maybe-release
    permissions:
      contents: write
      packages: write
    env:
      apps: "smp-server xftp-server ntf-server xftp"
      opt: ${{ github.event_name == 'pull_request' && 'O0' || 'O2' }}
      ghc_options: ${{ github.event_name == 'pull_request' && '--ghc-options=-O0' || '' }}
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
      postgres_dist: ${{ startsWith(github.ref, 'refs/tags/v') && 'dist-newstyle' || 'dist-postgres' }}
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # Allows passwordless access
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 22.04
            os_underscore: 22_04
            arch: x86-64
            runner: "ubuntu-22.04"
            ghc: "8.10.7"
            should_run: ${{ !(github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) }}
            cache_build: true
          - os: 22.04
            os_underscore: 22_04
            arch: x86-64
            runner: "ubuntu-22.04"
            ghc: "9.6.3"
            should_run: true
            cache_build: true
          - os: 24.04
            os_underscore: 24_04
            arch: x86-64
            runner: "ubuntu-24.04"
            ghc: "9.6.3"
            should_run: true
            cache_build: true
          - os: 22.04
            os_underscore: 22_04
            arch: aarch64
            runner: "ubuntu-22.04-arm"
            ghc: "9.6.3"
            should_run: true
            cache_build: true
          - os: 24.04
            os_underscore: 24_04
            arch: aarch64
            runner: "ubuntu-24.04-arm"
            ghc: "9.6.3"
            should_run: true
            cache_build: true
    steps:
      - name: Clone project
        if: matrix.should_run == true
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        if: matrix.should_run == true
        uses: simplex-chat/docker-setup-buildx-action@v3

      - name: Setup swap
        if: matrix.ghc == '8.10.7' && matrix.should_run == true
        uses: ./.github/actions/swap
        with:
          swap-size-gb: 20

      - name: Install PostgreSQL 15 client tools
        if: matrix.os == '22.04' && matrix.should_run == true
        shell: bash
        run: |
          # Import the repository signing key
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # Add the PostgreSQL APT repository
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          # Update repository and install postgresql tools
          sudo apt update
          sudo apt -y install postgresql-client-15

      - name: Log in to GitHub Container Registry
        if: matrix.should_run == true && env.release != 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and cache Docker image
        if: matrix.should_run == true
        uses: simplex-chat/docker-build-push-action@v6
        with:
          context: .
          load: true
          file: Dockerfile.build
          tags: build/${{ matrix.os }}:latest
          build-args: |
            TAG=${{ matrix.os }}
            GHC=${{ matrix.ghc }}
          cache-from: ${{ env.release != 'true' && format('type=registry,ref=ghcr.io/simplex-chat/simplexmq-build-cache:{0}-{1}-ghc{2}', matrix.os, matrix.arch, matrix.ghc) || '' }}
          cache-to: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && format('type=registry,ref=ghcr.io/simplex-chat/simplexmq-build-cache:{0}-{1}-ghc{2},mode=max,ignore-error=true', matrix.os, matrix.arch, matrix.ghc) || '' }}

      - name: Restore dependencies from cache
        id: restore-deps
        if: matrix.should_run == true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cabal/store
          key: deps-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-${{ github.sha }}
          restore-keys: deps-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-

      - name: Warn if dependencies not in cache
        if: matrix.should_run == true && steps.restore-deps.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::dependencies, ubuntu-${{ matrix.os }}-${{ matrix.arch }}, GHC ${{ matrix.ghc }}"

      - name: Restore build directories from cache
        id: restore-build
        if: matrix.should_run == true && matrix.cache_build == true && env.release != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dist-newstyle
            dist-postgres
          key: dist-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-${{ env.opt }}-${{ github.sha }}
          restore-keys: dist-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-${{ env.opt }}-

      - name: Warn if build directories not in cache
        if: matrix.should_run == true && matrix.cache_build == true && env.release != 'true' && github.event_name == 'push' && steps.restore-build.outputs.cache-matched-key == ''
        run: echo "::warning title=Cache miss::build directory, ubuntu-${{ matrix.os }}-${{ matrix.arch }}, GHC ${{ matrix.ghc }}"

      - name: Set old timestamps on unchanged sources (GHC 8.10.7)
        if: matrix.should_run == true && matrix.ghc == '8.10.7' && steps.restore-build.outputs.cache-matched-key != ''
        shell: bash
        run: |
          if [ -f dist-newstyle/sources.sha256 ]; then
            while read -r hash file; do
              if [ -f "$file" ] && [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$hash" ]; then
                touch -d 2000-01-01 "$file"
              fi
            done < dist-newstyle/sources.sha256
          fi

      - name: Start container
        if: matrix.should_run == true
        shell: bash
        run: |
          docker run -t -d \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            --name builder \
            -v ~/.cabal:/root/.cabal \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            build/${{ matrix.os }}:latest

      - name: Build smp-server, xftp-server (postgresql) and tests
        if: matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          chmod -fR 777 ~/.cabal ./dist-newstyle ./dist-postgres || :; git config --global --add safe.directory '*'
          version=$(awk '/^version:/ {print $2}' simplexmq.cabal)
          for d in dist-newstyle/build dist-postgres/build; do
            if [ -d "$d" ]; then
              find "$d" -mindepth 3 -maxdepth 3 -type d -name 'simplexmq-*' ! -name "simplexmq-$version" -exec rm -rf {} +
            fi
          done
          cabal update
          cabal build --builddir=${{ env.postgres_dist }} --jobs=$(nproc) --enable-tests -fserver_postgres ${{ env.ghc_options }}
          mkdir -p /out
          for i in smp-server xftp-server ntf-server simplexmq-test; do
            bin=$(find /project/${{ env.postgres_dist }} -name "$i" -type f -executable)
            chmod +x "$bin"
            cp "$bin" /out/
          done
          strip /out/smp-server /out/xftp-server /out/ntf-server

      - name: Copy simplexmq-test from container
        if: matrix.should_run == true
        shell: bash
        run: |
          docker cp builder:/out/simplexmq-test .

      - name: Copy smp-server, xftp-server (postgresql) from container and prepare it
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        id: prepare-postgres
        shell: bash
        run: |
          printf 'bins<<EOF\n' > bins.output
          printf 'hashes<<EOF\n' > hashes.output

          for i in smp-server xftp-server; do
            name="${i}-postgres-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}"
            docker cp builder:/out/$i $name

            path="${{ github.workspace }}/$name"
            hash="SHA2-256($name)= $(openssl sha256 $path | cut -d' ' -f 2)"

            printf '%s\n' "$path" >> bins.output
            printf '%s\n\n' "$hash" >> hashes.output
          done
          printf 'EOF\n' >> bins.output
          printf 'EOF\n' >> hashes.output

          cat bins.output >> "$GITHUB_OUTPUT"
          cat hashes.output >> "$GITHUB_OUTPUT"

      - name: Build everything else (standard)
        if: matrix.should_run == true
        shell: docker exec -t builder sh -eu {0}
        run: |
          cabal build --jobs=$(nproc) ${{ env.ghc_options }}
          mkdir -p /out
          for i in smp-server xftp-server xftp; do
            bin=$(find /project/dist-newstyle -name "$i" -type f -executable)
            strip "$bin"
            chmod +x "$bin"
            cp "$bin" /out/
          done

      - name: Copy binaries from container and prepare them
        id: prepare-regular
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        shell: bash
        run: |
          docker cp builder:/out .

          printf 'bins<<EOF\n' > bins.output
          printf 'hashes<<EOF\n' > hashes.output
          for i in ${{ env.apps }}; do
            name="$i-ubuntu-${{ matrix.os_underscore }}-${{ matrix.arch }}"

            mv ./out/$i ./$name

            path="${{ github.workspace }}/$name"
            hash="SHA2-256($name)= $(openssl sha256 $path | cut -d' ' -f 2)"

            printf '%s\n' "$path" >> bins.output
            printf '%s\n\n' "$hash" >> hashes.output
          done
          printf 'EOF\n' >> bins.output
          printf 'EOF\n' >> hashes.output

          cat bins.output >> "$GITHUB_OUTPUT"
          cat hashes.output >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        if: startsWith(github.ref, 'refs/tags/v') && matrix.should_run == true
        uses: simplex-chat/action-gh-release@v2
        with:
          append_body: true
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            ${{ steps.prepare-regular.outputs.hashes }}
            ${{ steps.prepare-postgres.outputs.hashes }}
          files: |
            ${{ steps.prepare-regular.outputs.bins }}
            ${{ steps.prepare-postgres.outputs.bins }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record source hashes (GHC 8.10.7)
        if: matrix.should_run == true && matrix.ghc == '8.10.7'
        shell: docker exec -t builder sh -eu {0}
        run: git ls-files -z '*.hs' '*.hsc' | xargs -0 sha256sum > dist-newstyle/sources.sha256

      - name: Compute dependency cache key
        id: hash-deps
        if: matrix.should_run == true && env.release != 'true'
        shell: bash
        run: echo "hash=$(ls ~/.cabal/store/ghc-*/ | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save dependencies to cache
        if: matrix.should_run == true && env.release != 'true' && steps.restore-deps.outputs.cache-matched-key != format('deps-{0}-{1}-ghc{2}-{3}', matrix.os, matrix.arch, matrix.ghc, steps.hash-deps.outputs.hash)
        uses: actions/cache/save@v4
        with:
          path: ~/.cabal/store
          key: deps-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-${{ steps.hash-deps.outputs.hash }}

      - name: Save build directories to cache
        if: matrix.should_run == true && matrix.cache_build == true && env.release != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist-newstyle
            dist-postgres
          key: dist-${{ matrix.os }}-${{ matrix.arch }}-ghc${{ matrix.ghc }}-${{ env.opt }}-${{ github.sha }}

      - name: Test
        if: matrix.should_run == true && matrix.arch == 'x86-64'
        timeout-minutes: 120
        shell: bash
        env:
          PGHOST: localhost
        run: |
          i=1
          attempts=1
          ${{ (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/v')) }} && attempts=3
          while [ "$i" -le "$attempts" ]; do
            if ./simplexmq-test; then
              break
            else
              echo "Attempt $i failed, retrying..."
              i=$((i + 1))
              sleep 1
            fi
          done
          if [ "$i" -gt "$attempts" ]; then
            echo "All "$attempts" attempts failed."
            exit 1
          fi

# =============================
#      Resolver test job
# =============================

# The SNRC resolver is Python, so this job needs none of the Haskell toolchain
# above and runs independently of it.

  resolver-test:
    name: "resolver (python)"
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v3

      - name: Set up uv
        # uv takes Python from .python-version, the version of the Dockerfile's runtime stage.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Lint
        working-directory: scripts/resolver/service
        run: uv run --frozen ruff check .

      - name: Test
        working-directory: scripts/resolver/service
        run: uv run --frozen pytest -v
