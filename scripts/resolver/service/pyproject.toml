[project]
name = "snrc-resolve"
version = "0.1.0"
description = "SimpleX Namespace (SNRC) resolver — REST API over ENS-shaped Ethereum registries"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "eth-hash[pycryptodome]>=0.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E9", "F", "B"]
